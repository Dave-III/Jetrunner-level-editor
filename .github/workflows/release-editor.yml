name: Release Windows editor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LevelEditorApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LevelEditorApp/package-lock.json
      - run: npm ci
      - name: Validate packaged compiler resources
        working-directory: .
        shell: pwsh
        run: |
          $required = @(
            'LevelEditorApp/Scripts/prune-release-assets.mjs',
            'UAssetPipeline/Resources/JETRUNNER/Content/Mods/CustomLevels/JLE_ObjectPlacer.uasset',
            'UAssetPipeline/Tools/UAssetGUI/UAssetGUI.exe',
            'UAssetPipeline/Tools/UAssetGUI/Data/Mappings/JETRUNNER.usmap',
            'UAssetPipeline/Tools/repak/repak.exe',
            'UAssetPipeline/Tools/repak/oo2core_9_win64.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) { throw "Release resources are missing: $($missing -join ', ')" }
      - name: Validate editor
        working-directory: .
        run: |
          node Scripts/Validate-EditorInteractions.mjs
          node Scripts/Audit-AssetSupport.mjs
          node Scripts/Validate-AssetSupportSerialization.mjs
          node Scripts/Validate-PreviewCollision.mjs
          npm --prefix LevelEditorApp run test:updater
          npm --prefix LevelEditorApp run test:framework
          npm --prefix LevelEditorApp run test:game-data
      - name: Build NSIS installer and updater metadata
        run: npm run package:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Validate updater artifacts
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $required = @(
            "release/JETRUNNER-Level-Editor-Setup-$version.exe",
            "release/JETRUNNER-Level-Editor-Setup-$version.exe.blockmap",
            'release/latest.yml'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) { throw "Updater artifacts are missing: $($missing -join ', ')" }
          if ((Get-Content -Raw release/latest.yml) -notmatch "(?m)^version: $([regex]::Escape($version))$") {
            throw 'latest.yml does not match package.json.'
          }
      - name: Build and validate modular payload metadata
        run: |
          node scripts/build-payload-release.mjs
          node scripts/validate-payload-release.cjs
      - name: Publish complete GitHub Release
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -ne 'tag') {
            Write-Host 'Manual workflow run built and validated the installer; publishing requires a version tag.'
            exit 0
          }
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          function Invoke-GitHubReleaseCommand {
            param(
              [string] $Label,
              [scriptblock] $Command
            )

            $delays = @(30, 60, 120, 180)
            for ($attempt = 0; $attempt -le $delays.Count; $attempt++) {
              & $Command
              if ($LASTEXITCODE -eq 0) {
                return
              }

              if ($attempt -eq $delays.Count) {
                throw "$Label failed after $($attempt + 1) attempts."
              }

              $delay = $delays[$attempt]
              Write-Warning "$Label failed (attempt $($attempt + 1)). Retrying in $delay seconds to allow GitHub's release API rate limit to clear."
              Start-Sleep -Seconds $delay
            }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Invoke-GitHubReleaseCommand 'Creating GitHub release' {
              gh release create $tag --title "JLE v$version" --notes-file RELEASE_NOTES.md
            }
          }
          # A payload can contain hundreds of content-addressed files. Uploading
          # the entire glob in one gh invocation can trigger GitHub's secondary
          # rate limit, and reruns must resume rather than start over.
          $remoteAssetNames = @(
            gh release view $tag --json assets --jq '.assets[].name'
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the existing GitHub release asset list.'
          }
          $remoteAssetSet = [System.Collections.Generic.HashSet[string]]::new(
            [string[]] $remoteAssetNames,
            [System.StringComparer]::OrdinalIgnoreCase
          )
          $releaseAssets = @(
            Get-Item -LiteralPath "release/JETRUNNER-Level-Editor-Setup-$version.exe"
            Get-Item -LiteralPath "release/JETRUNNER-Level-Editor-Setup-$version.exe.blockmap"
            Get-Item -LiteralPath 'release/latest.yml'
            Get-Item -LiteralPath 'release/payload/payload-release.json'
            Get-Item -LiteralPath 'release/payload/payload-manifest.json'
            Get-ChildItem -LiteralPath 'release/payload/blobs' -Filter '*.bin' -File | Sort-Object Name
          )
          $pendingAssets = @($releaseAssets | Where-Object { -not $remoteAssetSet.Contains($_.Name) })
          Write-Host "Release assets already present: $($releaseAssets.Count - $pendingAssets.Count). Remaining: $($pendingAssets.Count)."

          $batchSize = 25
          for ($offset = 0; $offset -lt $pendingAssets.Count; $offset += $batchSize) {
            $last = [Math]::Min($offset + $batchSize - 1, $pendingAssets.Count - 1)
            $batch = @($pendingAssets[$offset..$last] | ForEach-Object FullName)
            Invoke-GitHubReleaseCommand "Uploading release asset batch $([int]($offset / $batchSize) + 1)" {
              gh release upload $tag @batch --clobber
            }
            if ($last -lt ($pendingAssets.Count - 1)) {
              # Keep release API traffic below GitHub's secondary-rate threshold.
              Start-Sleep -Seconds 20
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
